<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModelMesh - AI Model Playground</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="bg-gray-100">
    <div id="confetti-canvas" class="fixed inset-0 pointer-events-none"></div>
    
    <nav class="bg-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600">ModelMesh</h1>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <span class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full px-2 py-1 text-xs animate-pulse" id="streak-counter">🔥 3</span>
                    <img src="https://api.dicebear.com/6.x/avataaars/svg?seed=Felix" class="w-10 h-10 rounded-full border-2 border-blue-500">
                </div>
                <div class="text-sm">
                    <div class="font-semibold">Level <span id="user-level">5</span></div>
                    <div class="text-gray-500"><span id="xp-counter">2400</span> XP</div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-xl p-6 mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Daily Challenge</h2>
                <div class="text-sm text-gray-500">Resets in <span id="challenge-timer">23:45:12</span></div>
            </div>
            <div class="bg-blue-50 rounded-lg p-4 mb-4">
                <div class="font-medium">🎯 Today's Goal: Train 3 models with 90%+ accuracy</div>
                <div class="mt-2 bg-gray-200 rounded-full h-2">
                    <div class="bg-blue-600 rounded-full h-2 w-2/3 transition-all duration-500"></div>
                </div>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <div class="bg-white rounded-lg shadow-xl p-6">
                <h3 class="text-lg font-semibold mb-4">Leaderboard</h3>
                <div class="space-y-4">
                    <div class="flex items-center justify-between p-2 bg-yellow-50 rounded">
                        <div class="flex items-center space-x-3">
                            <span class="text-xl">👑</span>
                            <img src="https://api.dicebear.com/6.x/avataaars/svg?seed=John" class="w-8 h-8 rounded-full">
                            <span class="font-medium">John D.</span>
                        </div>
                        <span class="font-bold">12,450 XP</span>
                    </div>
                    <!-- More leaderboard entries -->
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-xl p-6">
                <h3 class="text-lg font-semibold mb-4">Your Achievements</h3>
                <div class="grid grid-cols-3 gap-4">
                    <div class="text-center">
                        <div class="w-16 h-16 mx-auto mb-2 bg-blue-100 rounded-full flex items-center justify-center">
                            <span class="text-2xl">🚀</span>
                        </div>
                        <div class="text-sm">First Deploy</div>
                    </div>
                    <div class="text-center opacity-50">
                        <div class="w-16 h-16 mx-auto mb-2 bg-gray-100 rounded-full flex items-center justify-center">
                            <span class="text-2xl">🎯</span>
                        </div>
                        <div class="text-sm">Accuracy Master</div>
                    </div>
                    <!-- More achievements -->
                </div>
            </div>
        </div>
    </main>

    <div id="reward-popup" class="fixed bottom-4 right-4 bg-white rounded-lg shadow-xl p-4 hidden animate__animated animate__bounceIn">
        <div class="flex items-center space-x-3">
            <div class="text-2xl">🎉</div>
            <div>
                <div class="font-bold">Achievement Unlocked!</div>
                <div class="text-sm text-gray-500">First Successful Model Deploy</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>
    <script>
        // Gamification logic
        function showReward() {
            const popup = document.getElementById('reward-popup');
            popup.classList.remove('hidden');
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
            setTimeout(() => popup.classList.add('hidden'), 3000);
        }

        // Update streak counter every day
        function updateStreak() {
            const streak = parseInt(localStorage.getItem('streak') || 0);
            document.getElementById('streak-counter').textContent = `🔥 ${streak}`;
        }

        // Share achievements
        function shareAchievement(achievement) {
            if (navigator.share) {
                navigator.share({
                    title: 'ModelMesh Achievement Unlocked!',
                    text: `I just unlocked the ${achievement} achievement on ModelMesh! Join me in training AI models!`,
                    url: window.location.href
                });
            }
        }

        // Initialize
        updateStreak();
        
        // Demo: Show reward after 5 seconds
        setTimeout(showReward, 5000);
    </script>
</body>
</html>
