<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModelMesh - AI Model Playground</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="bg-gradient-to-br from-purple-900 to-indigo-900 min-h-screen text-white">
    <div class="container mx-auto px-4 py-8">
        <!-- Daily Challenge Banner -->
        <div class="animate__animated animate__pulse animate__infinite bg-gradient-to-r from-pink-500 to-yellow-500 p-4 rounded-lg mb-8 shadow-lg">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold">🏆 Daily Challenge</h2>
                    <p class="text-white/90">Train 3 models today and earn 500 MeshCoins!</p>
                </div>
                <div class="text-right">
                    <p class="text-3xl font-bold">2/3</p>
                    <p class="text-sm">Progress</p>
                </div>
            </div>
        </div>

        <!-- Achievement Showcase -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white/10 p-6 rounded-lg backdrop-blur-sm hover:transform hover:scale-105 transition-all cursor-pointer">
                <div class="flex items-center mb-4">
                    <span class="text-4xl mr-4">🎯</span>
                    <div>
                        <h3 class="font-bold">Model Master</h3>
                        <p class="text-sm text-white/70">Trained 50 models</p>
                    </div>
                </div>
                <div class="w-full bg-white/20 rounded-full h-2">
                    <div class="bg-green-500 h-2 rounded-full" style="width: 75%"></div>
                </div>
            </div>
            <div class="bg-white/10 p-6 rounded-lg backdrop-blur-sm hover:transform hover:scale-105 transition-all cursor-pointer">
                <div class="flex items-center mb-4">
                    <span class="text-4xl mr-4">⚡</span>
                    <div>
                        <h3 class="font-bold">Speed Demon</h3>
                        <p class="text-sm text-white/70">Train 5 models in 1 hour</p>
                    </div>
                </div>
                <div class="w-full bg-white/20 rounded-full h-2">
                    <div class="bg-yellow-500 h-2 rounded-full" style="width: 40%"></div>
                </div>
            </div>
            <div class="bg-white/10 p-6 rounded-lg backdrop-blur-sm hover:transform hover:scale-105 transition-all cursor-pointer">
                <div class="flex items-center mb-4">
                    <span class="text-4xl mr-4">🌟</span>
                    <div>
                        <h3 class="font-bold">Influencer</h3>
                        <p class="text-sm text-white/70">100 model shares</p>
                    </div>
                </div>
                <div class="w-full bg-white/20 rounded-full h-2">
                    <div class="bg-blue-500 h-2 rounded-full" style="width: 90%"></div>
                </div>
            </div>
        </div>

        <!-- Social Feed -->
        <div class="bg-white/5 rounded-xl p-6 backdrop-blur-lg">
            <h2 class="text-2xl font-bold mb-6">🔥 Trending Models</h2>
            <div class="space-y-4">
                <!-- Trending Model Card -->
                <div class="bg-white/10 p-4 rounded-lg hover:bg-white/20 transition-all cursor-pointer">
                    <div class="flex justify-between items-start">
                        <div class="flex items-center">
                            <img src="https://api.dicebear.com/6.x/avataaars/svg?seed=Felix" class="w-10 h-10 rounded-full mr-4">
                            <div>
                                <h3 class="font-bold">Image Generator v2</h3>
                                <p class="text-sm text-white/70">by @aimaster</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4">
                            <button class="flex items-center space-x-2 bg-white/20 px-4 py-2 rounded-full hover:bg-white/30 transition-all">
                                <span>🔥</span>
                                <span>2.4k</span>
                            </button>
                            <button class="flex items-center space-x-2 bg-white/20 px-4 py-2 rounded-full hover:bg-white/30 transition-all">
                                <span>🔄</span>
                                <span>Share</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating Action Button -->
        <button class="fixed bottom-8 right-8 bg-gradient-to-r from-pink-500 to-purple-500 p-4 rounded-full shadow-lg hover:transform hover:scale-110 transition-all animate__animated animate__pulse animate__infinite">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
        </button>
    </div>

    <!-- Reward Popup -->
    <div class="fixed top-4 right-4 bg-gradient-to-r from-yellow-400 to-yellow-600 p-4 rounded-lg shadow-lg animate__animated animate__fadeInRight">
        <div class="flex items-center space-x-4">
            <span class="text-4xl">🎉</span>
            <div>
                <h3 class="font-bold">Achievement Unlocked!</h3>
                <p>You earned 100 MeshCoins</p>
            </div>
        </div>
    </div>

    <script>
        // Add gamification logic here
        document.addEventListener('DOMContentLoaded', function() {
            // Simulate achievement notifications
            setInterval(() => {
                const rewards = ['🎉 +50 MeshCoins', '🏆 New Badge Unlocked!', '⭐ Level Up!'];
                const randomReward = rewards[Math.floor(Math.random() * rewards.length)];
                showNotification(randomReward);
            }, 45000);
        });

        function showNotification(message) {
            // Add notification logic
        }
    </script>
</body>
</html>
