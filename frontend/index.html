<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModelMesh Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #818cf8;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo svg {
            width: 24px;
            height: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-title {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .model-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            overflow: hidden;
        }

        .model-item {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .model-item:hover {
            background-color: #f1f5f9;
        }

        .model-status {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                ModelMesh Dashboard
            </div>
            <div id="connection-status" class="model-status status-active">Connected</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Active Models</div>
                <div class="stat-value" id="active-models">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Requests</div>
                <div class="stat-value" id="total-requests">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Average Latency</div>
                <div class="stat-value" id="avg-latency">0ms</div>
            </div>
        </div>

        <div class="model-list" id="model-list">
            <!-- Models will be inserted here dynamically -->
        </div>
    </div>

    <script>
        // Simulated data for demonstration
        let stats = {
            activeModels: 0,
            totalRequests: 0,
            avgLatency: 0
        };

        const models = [
            { name: 'bert-base', status: 'active', requests: 1250 },
            { name: 'gpt2-medium', status: 'active', requests: 890 },
            { name: 'resnet50', status: 'inactive', requests: 456 }
        ];

        function updateStats() {
            stats.activeModels = models.filter(m => m.status === 'active').length;
            stats.totalRequests = models.reduce((acc, m) => acc + m.requests, 0);
            stats.avgLatency = Math.round(Math.random() * 100);

            document.getElementById('active-models').textContent = stats.activeModels;
            document.getElementById('total-requests').textContent = stats.totalRequests.toLocaleString();
            document.getElementById('avg-latency').textContent = `${stats.avgLatency}ms`;
        }

        function renderModels() {
            const modelList = document.getElementById('model-list');
            modelList.innerHTML = models.map(model => `
                <div class="model-item">
                    <div>
                        <strong>${model.name}</strong>
                        <div style="color: #64748b; font-size: 0.875rem;">${model.requests.toLocaleString()} requests</div>
                    </div>
                    <div class="model-status status-${model.status}">${model.status}</div>
                </div>
            `).join('');
        }

        // Simulate real-time updates
        setInterval(() => {
            models.forEach(model => {
                if (Math.random() > 0.7) {
                    model.requests += Math.floor(Math.random() * 10);
                }
            });
            updateStats();
            renderModels();
        }, 2000);

        // Initial render
        updateStats();
        renderModels();

        // Add some interactivity
        document.querySelectorAll('.stat-card').forEach(card => {
            card.addEventListener('click', () => {
                card.style.animation = 'pulse 0.5s';
                setTimeout(() => card.style.animation = '', 500);
            });
        });
    </script>
</body>
</html>
