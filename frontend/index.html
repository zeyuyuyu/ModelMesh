<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModelMesh - Create Your AI Avatar</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .avatar-card {
            transition: all 0.3s ease;
        }
        .avatar-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .confetti {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 1000;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-500 to-indigo-600 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-white mb-4">Create Your AI Avatar</h1>
            <p class="text-xl text-white opacity-90">Join millions creating and sharing their digital twins!</p>
        </div>

        <div class="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
            <div class="bg-white rounded-xl p-6 shadow-lg">
                <div id="avatar-preview" class="h-64 bg-gray-100 rounded-lg mb-4 flex items-center justify-center">
                    <img id="current-avatar" src="#" class="hidden max-h-full rounded-lg">
                    <p class="text-gray-400">Your avatar will appear here</p>
                </div>

                <div class="space-y-4">
                    <div class="flex flex-wrap gap-2">
                        <button onclick="randomizeAvatar()" class="bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600 transition">Randomize</button>
                        <button onclick="generateAvatar()" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition">Generate</button>
                    </div>

                    <div class="flex flex-wrap gap-4">
                        <div class="w-full">
                            <label class="block text-sm font-medium text-gray-700">Style</label>
                            <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500">
                                <option>Anime</option>
                                <option>Realistic</option>
                                <option>Cartoon</option>
                                <option>Pixel Art</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-white rounded-xl p-6 shadow-lg">
                    <h3 class="text-xl font-bold mb-4">🏆 Today's Top Avatars</h3>
                    <div class="grid grid-cols-2 gap-4" id="trending-avatars">
                        <!-- Trending avatars populated dynamically -->
                    </div>
                </div>

                <div class="bg-white rounded-xl p-6 shadow-lg">
                    <h3 class="text-xl font-bold mb-4">🌟 Share Your Avatar</h3>
                    <div class="flex gap-2">
                        <button onclick="shareToTwitter()" class="flex-1 bg-blue-400 text-white px-4 py-2 rounded-lg hover:bg-blue-500 transition">Twitter</button>
                        <button onclick="shareToInstagram()" class="flex-1 bg-pink-500 text-white px-4 py-2 rounded-lg hover:bg-pink-600 transition">Instagram</button>
                        <button onclick="shareTikTok()" class="flex-1 bg-black text-white px-4 py-2 rounded-lg hover:bg-gray-800 transition">TikTok</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-12 text-center">
            <p class="text-white text-xl font-bold">👥 <span id="online-users">2,547</span> people creating avatars right now</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>
    <script>
        function randomizeAvatar() {
            // Simulate avatar generation
            setTimeout(() => {
                document.getElementById('current-avatar').src = 'https://picsum.photos/400';
                document.getElementById('current-avatar').classList.remove('hidden');
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }, 500);
        }

        function updateOnlineUsers() {
            const base = 2547;
            const random = Math.floor(Math.random() * 200) - 100;
            document.getElementById('online-users').textContent = base + random;
        }

        setInterval(updateOnlineUsers, 5000);

        // Social sharing functions
        function shareToTwitter() {
            // Implement Twitter sharing
            alert('Sharing to Twitter...');
        }

        function shareToInstagram() {
            // Implement Instagram sharing
            alert('Sharing to Instagram...');
        }

        function shareTikTok() {
            // Implement TikTok sharing
            alert('Sharing to TikTok...');
        }
    </script>
</body>
</html>
